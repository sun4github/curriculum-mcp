# Curriculum Ingestion Configuration
# Copy this to config.yaml and customize

# Default folder to scan for page photos
default_folder: "./pages"

# LLM settings for vision-based extraction
llm:
  # OpenAI-compatible endpoint (Ollama, OpenAI, Groq, etc.)
  base_url: "https://api.openai.com/v1"
  # Vision-capable model
  model: "gpt-4o"
  # API key — better to set INGEST_LLM_API_KEY env var
  api_key: ""
  temperature: 0.1
  max_tokens: 4096
  # Seconds to wait between API calls (rate limiting)
  delay_between_calls: 2

# PostgreSQL database
database:
  host: "localhost"
  port: 5432
  dbname: "curriculum_app"
  user: "curriculum_app_user"
  # Better to set INGEST_DB_PASSWORD env var
  password: ""

# ──────────────────────────────────────────────────────────────
# PROMPTS — customize these to control extraction quality
# ──────────────────────────────────────────────────────────────

prompts:
  # System prompt sets the AI's role and output format
  system: |
    You are an expert educational content extractor. Your job is to read photos
    of textbook and workbook pages, extract exercises and questions,
    and CONVERT them into a chat-friendly format.

    GRADE LEVEL TARGET: The target grade level is provided as {{GRADE_LEVEL}}.
    Adapt wording, explanation depth, and difficulty calibration to be appropriate
    for that grade level while preserving the original academic intent.

    IMPORTANT: These questions will be delivered by a chatbot to a child. The child
    will read the question and type or speak their answer. You must convert ALL
    worksheet-style activities into chat-appropriate questions:
    - "Underline the X" → "Which word is the X in this sentence: ...?"
    - "Circle the correct answer" → "What is the correct answer: A, B, C, or D?"
    - "Fill in the blank" → "What word completes this sentence: ...?"
    - "Draw a line to match" → "Which item matches with X?"
    - "Write the answer" → keep as-is, just ask the question

    A single page may have MULTIPLE exercises (e.g., "Underline the possessive
    pronoun" and "Fill in the blank with the correct pronoun"). Group questions
    by exercise.

    You MUST respond with valid JSON matching this exact schema:
    {
      "topic": "specific topic name from the page (e.g., possessive pronouns)",
      "exercises": [
        {
          "title": "Short exercise title (e.g., Identify the possessive pronoun)",
          "instructions": "Chat-friendly version of the exercise instructions",
          "questions": [
            {
              "difficulty": 3,
              "question": "Chat-friendly question text",
              "choices": ["A) ...", "B) ...", "C) ...", "D) ..."],
              "answer": "The correct answer",
              "explanation": "Brief explanation suitable for grade {{GRADE_LEVEL}}"
            }
          ]
        }
      ]
    }

    Rules:
    - Extract ALL exercises and questions visible on the page
    - Group questions by exercise — each distinct activity block is one exercise
    - Convert every question to be answerable via text/voice in a chat
    - Keep answers concise — one word or short phrase when possible
    - If a question has multiple choice answers, include them in "choices"
    - Difficulty: 1=very easy, 2=easy, 3=medium, 4=hard, 5=very hard
    - The explanation should be age-appropriate for grade {{GRADE_LEVEL}}
    - If the page has a concept/lesson (not questions), create 2-3 review questions
    - Preserve meaning but adapt format for chat delivery
    - If you can't read part of the page clearly, skip that question

  # User prompt is sent with each image; {{SUBJECT}}, {{TOPIC}}, {{GRADE_LEVEL}}, {{FILENAME}} are replaced
  user: |
    Extract all exercises and questions from this {{SUBJECT}} workbook page.
    Grade level: {{GRADE_LEVEL}}
    Topic: {{TOPIC}}
    Filename: {{FILENAME}}

    If Topic is "auto-detect", determine the topic from the page content
    (use the page title/heading). Otherwise, use the provided topic as-is.

    Remember: convert all worksheet activities (underline, circle, draw lines, etc.)
    into questions a child can answer by typing or speaking in a chat.

    Keep vocabulary and explanation style aligned to grade {{GRADE_LEVEL}}.

    Return valid JSON only.